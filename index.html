
<!DOCTYPE html>
<html lang="ja">

<head>
  <base target="_top">
  <meta charset="UTF-8">

  <title>お祝いメッセージ</title>

  <style>

    /* ========================================
       デザイン設定
       ======================================== */

    :root {
      --background: #f8f6f2;
      --card-background: #ffffff;

      --text-color: #333333;
      --name-color: #69533e;
      --accent-color: #c5a47e;
      --border-color: #e5ded5;

      --card-radius: 12px;
      --card-gap: 16px;
      --card-padding: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text-color);

      font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      line-height: 1.7;
    }

    /* ========================================
       ページ全体
       ======================================== */

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    /* ========================================
       ヘッダー
       ======================================== */

    .page-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .eyebrow {
      margin-bottom: 12px;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: var(--accent-color);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .decoration {
      width: 64px;
      height: 2px;
      margin: 20px auto;
      background: var(--accent-color);
    }

    .subtitle {
      margin: 0;
      font-size: 16px;
      color: #777777;
    }

    /* ========================================
       セクション共通
       ======================================== */

    .section-title {
      margin: 0 0 24px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: var(--name-color);
    }

    /* ========================================
       イラスト展示
       ======================================== */

    .illustration-section {
      max-width: 850px;
      margin: 0 auto 64px;
    }

    .illustration-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .illustration-item {
      margin: 0;
      min-width: 0;
    }

    .illustration-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;

      border-radius: 8px;
      cursor: zoom-in;
    }

    .illustration-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }

    .illustration-button:focus-visible {
      outline: 3px solid var(--accent-color);
      outline-offset: 4px;
    }

    .illustration-credit {
      margin: 16px 0 0;
      text-align: center;
      color: #777777;
      font-size: 13px;
    }

    /* ========================================
       メッセージ一覧
       ======================================== */

    .message-section {
      margin-top: 24px;
    }

    .message-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--card-gap);
    }

    /* ========================================
       各メッセージカード
       ======================================== */

    .message-card {
      background: var(--card-background);

      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);

      padding: var(--card-padding);
      min-height: 170px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.025);
    }

    .card-name {
      margin: 0;

      font-size: 18px;
      font-weight: 600;
      color: var(--name-color);

      overflow-wrap: anywhere;
    }

    .card-divider {
      width: 32px;
      height: 1px;
      flex-shrink: 0;

      margin: 14px 0;
      background: var(--accent-color);
    }

    .card-message {
      margin: 0;

      font-size: 16px;
      line-height: 1.8;
      font-weight: 400;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty-heart {
      font-size: 24px;
      line-height: 1.5;
      color: var(--accent-color);
    }

    /* ========================================
       読み込み表示
       ======================================== */

    .status {
      padding: 32px 0;
      text-align: center;
      color: #777777;
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }

    /* ========================================
       イラスト拡大表示
       ======================================== */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
      background: rgba(0, 0, 0, 0.88);
    }

    .lightbox-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 12px;
      right: 16px;

      width: 44px;
      height: 44px;

      border: 0;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;

      font-size: 28px;
      cursor: pointer;
    }

    /* ========================================
       フッター
       ======================================== */

    footer {
      margin-top: 56px;
      text-align: center;

      font-size: 14px;
      color: #999999;
      letter-spacing: 0.04em;
    }

    /* ========================================
       タブレット
       ======================================== */

    @media (max-width: 850px) {
      .message-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* ========================================
       スマートフォン
       ======================================== */

    @media (max-width: 560px) {

      .container {
        padding: 32px 16px 48px;
      }

      .page-header {
        margin-bottom: 36px;
      }

      h1 {
        font-size: 24px;
      }

      .section-title {
        font-size: 18px;
      }

      /* イラストはスマホでも2列 */
      .illustration-section {
        margin-bottom: 48px;
      }

      .illustration-grid {
        gap: 10px;
      }

      /* メッセージは1列 */
      .message-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .message-card {
        min-height: 130px;
        padding: 20px;
      }

      .lightbox {
        padding: 12px;
      }
    }

  </style>
</head>


<body>

  <div class="container">

    <!-- ===================================
         タイトル
         =================================== -->

    <header class="page-header">

      <div class="eyebrow">
        WITH ALL OUR BIG ぉヴぇ

      <h1>月野木ちろる様<br>

      <div class="decoration"></div>

    <!-- ===================================

    <section class="illustration-section">

      </h2>

      <div

      <p

    </section>


    <!-- ===================================
         メッセージ一覧
         =================================== -->

    <main class="message-section">

      <h2 class="section-title">
        以下の方々にご賛同いただいております．
      </h2>

      <div
        id="messageStatus"

      </div>

      <div
        id="messageGrid"
        class="message-grid"
        aria-label="お祝いメッセージ一覧">
      </div>

    </main>


    <!-- ===================================
         フッター
         =================================== -->

    <footer>
      ご参加いただきありがとうございました．
    </footer>

  </div>

    // =====================================
    // メッセージカード生成
    // =====================================

    function createMessageCard(item) {

      const card = document.createElement("article");
      card.className = "message-card";

      // 名前
      const name = document.createElement("h3");
      name.className = "card-name";
      name.textContent = item.name;

      // 区切り線
      const divider = document.createElement("div");
      divider.className = "card-divider";
      divider.setAttribute("aria-hidden", "true");

      // メッセージ
      const message = document.createElement("p");
      message.className = "card-message";

      if (item.message && item.message.trim() !== "") {

        message.textContent = item.message;

      } else {

        message.textContent = "♡";
        message.classList.add("empty-heart");

        // 装飾として扱う
        message.setAttribute("aria-hidden", "true");

      }

      card.appendChild(name);
      card.appendChild(divider);
      card.appendChild(message);

      return card;
    }


    // =====================================
    // メッセージ一覧表示
    // =====================================

    function displayMessages(messages) {

      const grid = document.getElementById(
        "messageGrid"
      );

      const status = document.getElementById(
        "messageStatus"
      );

      grid.replaceChildren();

      if (!messages || messages.length === 0) {
        status.textContent =
          "掲載中のメッセージはありません。";
        status.hidden = false;
        return;
      }

      const fragment = document.createDocumentFragment();

      messages.forEach(item => {
        fragment.appendChild(
          createMessageCard(item)
        );
      });

      grid.appendChild(fragment);
      status.hidden = true;
    }


    // =====================================
    // メッセージ取得
    // =====================================

    function loadMessages() {

      google.script.run
        .withSuccessHandler(displayMessages)
        .withFailureHandler(error => {

          console.error(
            "メッセージ取得エラー:",
            error
          );

          const status = document.getElementById(
            "messageStatus"
          );

          status.textContent =
            "メッセージを読み込めませんでした。";

          status.hidden = false;

        })
        .getPublicMessages();
    }


    // =====================================
    // イラスト拡大表示
    // =====================================

    function openIllustration(src, alt) {

      const previousFocus = document.activeElement;

      const overlay = document.createElement("div");
      overlay.className = "lightbox";
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-modal", "true");
      overlay.setAttribute(
        "aria-label",
        "イラストの拡大表示"
      );

      const img = document.createElement("img");
      img.className = "lightbox-image";
      img.src = src;
      img.alt = alt;

      const closeButton = document.createElement("button");
      closeButton.className = "lightbox-close";
      closeButton.type = "button";
      closeButton.textContent = "×";
      closeButton.setAttribute(
        "aria-label",
        "拡大表示を閉じる"
      );

      function closeLightbox() {

        document.removeEventListener(
          "keydown",
          handleKeydown
        );

        overlay.remove();

        if (previousFocus &&
            typeof previousFocus.focus === "function") {
          previousFocus.focus();
        }
      }

      function handleKeydown(event) {

        if (event.key === "Escape") {
          closeLightbox();
        }

        // 拡大中のフォーカスを閉じるボタンに保つ
        if (event.key === "Tab") {
          event.preventDefault();
          closeButton.focus();
        }
      }

      closeButton.addEventListener(
        "click",
        closeLightbox
      );

      overlay.addEventListener("click", event => {

        if (event.target === overlay) {
          closeLightbox();
        }

      });

      overlay.appendChild(img);
      overlay.appendChild(closeButton);

      document.body.appendChild(overlay);

      document.addEventListener(
        "keydown",
        handleKeydown
      );

      closeButton.focus();
    }


    // =====================================
    // イラスト表示
    // =====================================

    function displayIllustrations(data) {

      const grid = document.getElementById(
        "illustrationGrid"
      );

      const credit = document.getElementById(
        "illustrationCredit"
      );

      const status = document.getElementById(
        "illustrationStatus"
      );

      grid.replaceChildren();
      credit.textContent = "";

      if (!data || !data.images ||
          data.images.length === 0) {

        status.textContent =
          "掲載中のイラストはありません。";
        status.hidden = false;

        return;
      }

      const fragment = document.createDocumentFragment();

      data.images.forEach((item, index) => {

        const figure = document.createElement("figure");
        figure.className = "illustration-item";

        const button = document.createElement("button");
        button.className = "illustration-button";
        button.type = "button";
        button.setAttribute(
          "aria-label",
          `イラスト${index + 1}を拡大`
        );

        const img = document.createElement("img");
        img.className = "illustration-image";
        img.src = item.src;
        img.alt = item.alt;
        img.loading = "lazy";

        // クリック・タップで拡大
        button.addEventListener("click", () => {
          openIllustration(item.src, item.alt);
        });

        button.appendChild(img);
        figure.appendChild(button);
        fragment.appendChild(figure);
      });

      grid.appendChild(fragment);

      // 作者名は2枚まとめて1回だけ表示
      if (data.creator) {
        credit.textContent =
          `Illustrations by ${data.creator}`;
      }

      status.hidden = true;
    }


    // =====================================
    // イラスト取得
    // =====================================

    function loadIllustrations() {

      google.script.run
        .withSuccessHandler(displayIllustrations)
        .withFailureHandler(error => {

          console.error(
            "イラスト取得エラー:",
            error
          );

          const status = document.getElementById(
            "illustrationStatus"
          );

          status.textContent =
            "イラストを読み込めませんでした。";

          status.hidden = false;

        })
        .getPublicIllustrations();
    }


    // =====================================
    // 初期化
    // =====================================

    document.addEventListener("DOMContentLoaded", () => {

      // HTMLに埋め込んだデータを表示する
      displayMessages(STATIC_DATA.messages);
      displayIllustrations(STATIC_DATA.illustrations);

    });

  </script>
